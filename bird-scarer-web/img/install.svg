<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" class="dg dg-model" role="img" aria-labelledby="ins-title ins-desc">
  <title id="ins-title">ภาพจำลองหลังติดตั้ง (มองจากด้านหน้าผนัง)</title>
  <desc id="ins-desc">กล่อง 28 x 19 x 13 ซม. ติดผนังใต้ชายคา แผงโซลาร์ 20W ขนาดประมาณ 42 x 34 ซม. ติดบนขายึดเหนือชายคา เอียง 15 องศาหันทิศใต้ ลำโพงฮอร์นติดใต้กล่องก้มลง 10 ถึง 15 องศา หันไปทางขอบบัวที่นกเกาะ ซึ่งอยู่ห่าง 1.3 ถึง 2.2 เมตร อยู่ในระยะตรวจจับของเรดาร์ 2.25 เมตร</desc>

  <!-- house -->
  <rect class="m-wall" x="-600" y="120" width="2000" height="600"/>
  <rect class="m-shadow" x="-600" y="120" width="2000" height="24"/>
  <rect class="m-roof" x="-600" y="66" width="2000" height="38"/>
  <path class="m-roof-line" d="M-600 78H1400M-600 91H1400M40 66V104M120 66V104M200 66V104M280 66V104M360 66V104M440 66V104M520 66V104M600 66V104M680 66V104M760 66V104"/>
  <rect class="m-fascia" x="-600" y="104" width="2000" height="16"/>
  <text class="t-pin" x="784" y="138" text-anchor="end">ใต้ชายคา</text>
  <text class="t-pin" x="784" y="300" text-anchor="end">ผนังบ้าน</text>

  <!-- radar coverage: 0.75 m per gate, 160 px = 1 m -->
  <path class="m-cone" d="M245 175L603.6 143.6A360 360 0 0 1 520.8 406.4Z"/>
  <path class="m-arc" d="M364.5 164.5A120 120 0 0 1 336.9 252.1M484.1 154.1A240 240 0 0 1 428.9 329.3M603.6 143.6A360 360 0 0 1 520.8 406.4"/>
  <text class="t-tiny m-cone-text" x="366" y="156" text-anchor="middle">0.75 ม.</text>
  <text class="t-tiny m-cone-text" x="486" y="146" text-anchor="middle">1.5 ม.</text>
  <text class="t-tiny m-cone-text" x="606" y="136" text-anchor="middle">2.25 ม.</text>

  <!-- ledge with pigeons -->
  <rect class="m-ledge" x="410" y="300" width="320" height="14"/>
  <rect class="m-ledge-under" x="410" y="314" width="320" height="8"/>
  <g class="dv-bird">
    <path transform="translate(436 300)" d="M0 0C6-10 18-16 30-14C34-22 44-22 48-16L55-14L48-11C46-3 38 1 26 1Z"/>
    <path transform="translate(532 300) scale(-1 1) translate(-55 0)" d="M0 0C6-10 18-16 30-14C34-22 44-22 48-16L55-14L48-11C46-3 38 1 26 1Z"/>
  </g>
  <text class="t-pin m-strong" x="570" y="342" text-anchor="middle">ขอบบัว / จุดที่นกเกาะ</text>
  <text class="t-tiny" x="570" y="360" text-anchor="middle">ห่างกล่อง ~1.3–2.2 ม. อยู่ในระยะเรดาร์</text>

  <!-- solar panel on bracket -->
  <path class="dv-pole" d="M214 61V104"/>
  <rect class="panel-grid" x="180" y="8" width="68" height="53" rx="2"/>
  <path class="m-panel-line" d="M197 8V61M214 8V61M231 8V61M180 26H248M180 43H248"/>
  <text class="t-pin m-strong" x="172" y="26" text-anchor="end">แผงโซลาร์ 20W</text>
  <text class="t-tiny" x="172" y="42" text-anchor="end">≈ 42×34 ซม. · เอียง 15°</text>
  <text class="t-tiny" x="172" y="56" text-anchor="end">หันทิศใต้</text>

  <!-- cable with drip loop -->
  <path class="m-cable" d="M246 60H258V200Q258 212 249 212Q240 212 240 202V190"/>

  <!-- box 280x190 mm = 45x30 px -->
  <rect class="box box-logic" x="200" y="160" width="45" height="30" rx="3"/>
  <text class="t-pin m-strong" x="190" y="172" text-anchor="end">กล่อง 28×19×13 ซม.</text>
  <text class="t-tiny" x="190" y="187" text-anchor="end">ใต้ชายคา ฝนสาดไม่ถึง</text>

  <!-- horn under the box, tilted down -->
  <path class="dv-pole" d="M210 190V204"/>
  <g class="horn" transform="rotate(12 206 214)">
    <rect x="200" y="206" width="10" height="16" rx="2"/>
    <path d="M210 208L234 199V229L210 220Z"/>
  </g>
  <text class="t-pin m-strong" x="190" y="222" text-anchor="end">ฮอร์น ปาก ≈ 15–20 ซม.</text>
  <text class="t-tiny" x="190" y="237" text-anchor="end">ก้มลง 10–15° หันไปที่ขอบบัว</text>

  <!-- inset: panel tilt (side view) -->
  <rect class="m-inset" x="566" y="392" width="214" height="112" rx="10"/>
  <text class="t-tiny m-strong" x="673" y="412" text-anchor="middle">มุมมองด้านข้างแผง</text>
  <path class="m-dim" d="M586 488H760"/>
  <path class="m-panel-side" d="M604 488L720 457"/>
  <path class="m-arc" d="M654 488A50 50 0 0 0 652 475"/>
  <text class="t-tiny" x="664" y="482">15°</text>
  <text class="t-tiny" x="600" y="440">ด้านหน้าแผงหันไปทิศใต้</text>

  <!-- scale bar: 1 m = 160 px -->
  <path class="m-dim" d="M40 486H200M40 480V492M120 482V490M200 480V492"/>
  <text class="t-tiny" x="40" y="476">0</text>
  <text class="t-tiny" x="120" y="476" text-anchor="middle">0.5</text>
  <text class="t-tiny" x="200" y="476" text-anchor="middle">1 ม.</text>
  <text class="t-tiny" x="40" y="510">วาดตามสัดส่วนจริง · ความสูงจริงขึ้นกับบ้าน</text>
</svg>

# Builds greenhouse/ and publishes it to GitHub Pages.
# Template: copy to .github/workflows/greenhouse-pages.yml at the repo root.
# One-time setup: repo Settings → Pages → Source: GitHub Actions.
name: Deploy greenhouse to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'greenhouse/**'
      - '.github/workflows/greenhouse-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: greenhouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: greenhouse/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: greenhouse/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

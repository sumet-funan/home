<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แอปของเรา</title>
  <meta name="description" content="รวมเว็บแอปภาษาไทยที่ทำไว้ เลือกเปิดได้เลย">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf6f0;
      --surface: #ffffff;
      --text: #2b2622;
      --muted: #6f665d;
      --border: #ebe3d8;
      --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 6px 20px rgba(60, 40, 20, .06);
      --shadow-hover: 0 2px 4px rgba(60, 40, 20, .08), 0 12px 32px rgba(60, 40, 20, .12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1916;
        --surface: #26231f;
        --text: #f1ebe3;
        --muted: #a99f94;
        --border: #37322c;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3);
        --shadow-hover: 0 8px 28px rgba(0, 0, 0, .45);
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 40px 16px 56px;
    }

    header { margin-bottom: 28px; }
    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 2.4rem);
      font-weight: 700;
      line-height: 1.25;
    }
    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .apps {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 640px) {
      .apps { grid-template-columns: 1fr 1fr; gap: 20px; }
    }

    .card {
      position: relative;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      height: 100%;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--accent);
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent);
    }
    .card:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
    }

    .icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      font-size: 30px;
      line-height: 1;
    }

    .body { min-width: 0; }
    .tag {
      display: inline-block;
      padding: 1px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
      font-size: .8rem;
      font-weight: 600;
    }
    .card h2 {
      margin: 6px 0 2px;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.4;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>แอปของเรา</h1>
      <p>รวมเว็บแอปภาษาไทยที่ทำไว้ เลือกเปิดได้เลย</p>
    </header>

    <ul class="apps" id="apps"></ul>
  </main>

  <script>
    // รายการแอปทั้งหมด: เพิ่มแอปใหม่ได้ที่นี่ที่เดียว
    // href คือโฟลเดอร์ที่เปิดใช้ได้จริงบน GitHub Pages (ถ้าเป็นแอปที่ต้อง build ให้ชี้ไปที่ผลลัพธ์ที่ build แล้ว)
    // accent ใส่สองสี [โหมดสว่าง, โหมดมืด]
    const apps = [
      {
        href: "math-lesson/",
        icon: "🧮",
        name: "ThinkGrow บทเรียนคณิตศาสตร์",
        desc: "ฝึกบวก ลบ คูณ หาร สำหรับเด็ก สะสมถ้วยรางวัล และสร้างเมืองของตัวเอง",
        tag: "บทเรียน",
        accent: ["#2f6fdb", "#7aa7ff"],
      },
      {
        href: "image-color-diff/",
        icon: "🎨",
        name: "สีตรงกันไหม?",
        desc: "เกมถ่ายรูปขนมกับเครื่องดื่ม แล้วให้แอปวัดว่าสีของแต่ละคนเหมือนกันกี่เปอร์เซ็นต์",
        tag: "เกม",
        accent: ["#c2410c", "#fb923c"],
      },
      {
        href: "greenhouse/app/",
        icon: "🥬",
        name: "สร้างโรงเรือนผักสลัด 3 มิติ",
        desc: "คู่มือสร้างโรงเรือน 3×6 ม. จากเหล็กกล่อง ทีละขั้นด้วยแอนิเมชัน 3 มิติ",
        tag: "คู่มือ DIY",
        accent: ["#15803d", "#4ade80"],
      },
      {
        href: "bird-scarer-web/",
        icon: "🕊️",
        name: "เครื่องไล่นกพิราบ พลังงานโซลาร์",
        desc: "คู่มือประกอบเครื่องไล่นกด้วย ESP32 มีรายการชิ้นส่วน วงจร และเฟิร์มแวร์",
        tag: "คู่มือ DIY",
        accent: ["#7c3aed", "#b794f6"],
      },
    ];

    const dark = window.matchMedia("(prefers-color-scheme: dark)");
    const list = document.getElementById("apps");

    function render() {
      list.replaceChildren(...apps.map((app) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.className = "card";
        a.href = app.href;
        a.style.setProperty("--accent", app.accent[dark.matches ? 1 : 0]);

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = app.icon;

        const body = document.createElement("div");
        body.className = "body";
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = app.tag;
        const h2 = document.createElement("h2");
        h2.textContent = app.name;
        const p = document.createElement("p");
        p.textContent = app.desc;
        body.append(tag, h2, p);

        a.append(icon, body);
        li.append(a);
        return li;
      }));
    }

    render();
    dark.addEventListener("change", render);
  </script>
</body>
</html>
